<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>AVORA · Sin conexión</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
      background: #f7f8f4; color: #164735;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 340px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 24px; }
    h1 { margin: 0 0 8px; font-size: 24px; line-height: 1.2; }
    p { margin: 0 0 28px; font-size: 16px; line-height: 1.5; color: #4d6b5f; }
    button {
      appearance: none; border: 0; border-radius: 14px; padding: 14px 28px;
      background: #164735; color: #fff; font-size: 16px; font-weight: 600;
    }
    button:active { opacity: .85; }
  </style>
</head>
<body>
  <main>
    <svg class="mark" viewBox="0 0 64 64" fill="none" aria-hidden="true">
      <rect x="5" y="5" width="54" height="54" rx="17" fill="#fff" stroke="#dde4de" stroke-width="2"/>
      <g transform="translate(14 13.6) scale(0.383)" fill="#164735">
        <path d="M28 30 L54 80 L42 80 L28 52 L14 80 L2 80 Z" opacity="0.32"/>
        <path d="M60 16 L94 80 L79 80 L60 44 L41 80 L26 80 Z"/>
      </g>
    </svg>
    <h1>Sin conexión</h1>
    <p>AVORA necesita internet para traer tus datos. Revisá tu conexión y volvé a intentar.</p>
    <button type="button" id="retry">Reintentar</button>
  </main>
  <script>
    // La dirección real se escribe al preparar la app (scripts/native/prepare-shell.mjs).
    document.getElementById("retry").addEventListener("click", function () {
      window.location.replace("__SERVER_URL__");
    });
  </script>
</body>
</html>
